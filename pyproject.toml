[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-migration-idempotency-checker"
version = "0.1.0"
description = "Transactional schema migration verifier testing forward and rollback idempotency in automated agent database migrations"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-migration-idempotency-checker = "agent_migration_idempotency_checker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_migration_idempotency_checker*"]
